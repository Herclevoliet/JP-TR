    // Aynı kartı tekrar eklememek için kontrol (jp + tr bazlı)
    function mergeCards(defaultCards, storedCards) {
      const merged = [...storedCards];
    
      defaultCards.forEach(def => {
        const exists = storedCards.some(c => c.jp === def.jp && c.tr === def.tr);
        if (!exists) {
          merged.push(def);
        }
      });
    
      return merged;
    }

    function startLesson(type) {
      currentLessonType = type;
      const saved = JSON.parse(localStorage.getItem("lessonState"));

      // Eğer ALL seçildi ve kayıt varsa
      if (type === "all" && saved && saved.type === "all") {
        const devam = confirm("Kaldığınız yerden devam etmek ister misiniz?");
        
        if (devam) {
          lessonCards = saved.lessonCards.filter(savedCard =>
            cards.some(c => c.jp === savedCard.jp && c.tr === savedCard.tr)
          );
          currentIndex = saved.currentIndex;
          showCard();
          document.getElementById("card-area").classList.remove("hidden");
          return;
        } else {
          localStorage.removeItem("lessonState");
        }
      }

      // Normal başlatma
      if (type === "all") lessonCards = [...cards];
      if (type === "favorites") lessonCards = cards.filter(c => c.favorite);
      if (type === "dontknow") lessonCards = cards.filter(c => c.dontKnow);

      if (lessonCards.length === 0) {
        alert("Bu derste çalışacak kart yok.");
        return;
      }

      if (studyMode === "random") {
        shuffle(lessonCards);
      } else {
        lessonCards.sort((a, b) => a.jp.localeCompare(b.jp, "ja"));
      }
      currentIndex = 0;

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }

      const total = cards.length;
      const fav = cards.filter(c => c.favorite).length;
      const dk = cards.filter(c => c.dontKnow).length;
      document.getElementById("stats-panel").innerHTML =
        `Toplam kart: ${total}<br>Favoriler: ${fav}<br>Bilmediklerim: ${dk}`;
      document.getElementById("stats-panel").classList.remove("hidden");
      document.getElementById("card-area").classList.add("hidden");
      document.getElementById("list-panel").classList.add("hidden");
      document.getElementById("settings-panel").classList.add("hidden");
    }

    // Japonca sesli okuma
    function speakJapanese(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "ja-JP";
      utterance.volume = volumeLevel;
      speechSynthesis.speak(utterance);
    }

    // Telaffuz aç/kapat
    function toggleAutoPronounce() {
      autoPronounce = !autoPronounce;
      document.getElementById("pronounce-btn").textContent =
        autoPronounce ? "🎙️ Telaffuz: Açık" : "🎙️ Telaffuz: Kapalı";
    }

    // Ayarlar paneli
    function showSettings() {
      let html = `<h2>⚙️ Ayarlar</h2>`;

      html += `<label>Ses Seviyesi: 
        <input type="range" min="0" max="1" step="0.1" value="${volumeLevel}" 
        onchange="volumeLevel=this.value"></label><br><br>`;

      html += `<h3>Kısayollar</h3>`;

      for (let key in shortcuts) {
        html += `${key}:
          <input type="text" value="${shortcuts[key]}" 
          onfocus="this.value=''" 
          onkeydown="setShortcut('${key}', event)">
          <br>`;
      }

      // ✅ BURAYA TAŞINDI
      html += `<h3>Çalışma Türü</h3>
        <label>
          <input type="radio" name="mode" value="random" ${studyMode==="random"?"checked":""}
          onchange="setStudyMode('random')"> Rastgele
        </label><br>
        <label>
          <input type="radio" name="mode" value="alphabetical" ${studyMode==="alphabetical"?"checked":""}
          onchange="setStudyMode('alphabetical')"> Alfabetik
        </label><br><br>`;

      document.getElementById("settings-panel").innerHTML = html;
      document.getElementById("settings-panel").classList.remove("hidden");
      document.getElementById("card-area").classList.add("hidden");
      document.getElementById("list-panel").classList.add("hidden");
      document.getElementById("stats-panel").classList.add("hidden");
    }

    function setShortcut(action, event) {
      event.preventDefault();
      shortcuts[action] = event.key;
      showSettings();
    }

    function saveLessonState(type) {
      const state = {
        type,
        lessonCards,
        currentIndex
      };
      localStorage.setItem("lessonState", JSON.stringify(state));
    }

    function setStudyMode(mode) {
      studyMode = mode;
      localStorage.setItem("studyMode", mode);
    }

    function showTrash() {
      let html = `<h2>🗑️ Çöp Kutusu</h2>`;

      if (trash.length === 0) {
        html += `<p>Çöp kutusu boş</p>`;
      }

      trash.forEach((c, i) => {
        html += `<div class="list-item">
          <span>${c.jp} — ${c.tr}</span>
          <button onclick="restoreCard(${i})">♻️ Geri Al</button>
          <button onclick="permanentlyDelete(${i})">❌ Kalıcı Sil</button>
        </div>`;
      });

      document.getElementById("list-panel").innerHTML = html;
      document.getElementById("list-panel").classList.remove("hidden");
      document.getElementById("card-area").classList.add("hidden");
      document.getElementById("stats-panel").classList.add("hidden");
      document.getElementById("settings-panel").classList.add("hidden");
    }

    function restoreCard(i) {
      const exists = cards.some(c => c.jp === trash[i].jp && c.tr === trash[i].tr);

      if (!exists) {
        cards.push(trash[i]);
      }

      trash.splice(i, 1);
      saveCards();
      saveTrash();
      showTrash();
    }

    function permanentlyDelete(i) {
      if (confirm("Kalıcı olarak silinsin mi?")) {
        trash.splice(i, 1);
        saveTrash();
        showTrash();
      }
    }
    // Klavye kısayolları
    document.addEventListener("keydown", (e) => {
      if (!currentCard) return;
      if (e.key === shortcuts.know) markKnow();
      if (e.key === shortcuts.dontKnow) markDontKnow();
      if (e.key === shortcuts.favorite) toggleFavorite();
      if (e.key === shortcuts.speak) speakJapanese(currentCard.jp);
      if (e.key === shortcuts.reveal) {
        e.preventDefault();
        document.getElementById("tr-text").classList.toggle("hidden");
      }
    });
  </script>
</body>
</html>
